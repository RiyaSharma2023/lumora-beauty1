<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container">
            <a class="navbar-brand" href="index.html">Lumora Beauty</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="skincare.html">Skincare</a></li>
                    <li class="nav-item"><a class="nav-link" href="makeup.html">Makeup</a></li>
                    <li class="nav-item"><a class="nav-link" href="haircare.html">Haircare</a></li>
                    <li class="nav-item"><a class="nav-link" href="accessories.html">Accessories</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <div class="navbar-icons d-flex gap-3">
                    <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
                    <a href="#"><i class="fa-regular fa-user"></i></a>
                    <a href="#"><i class="fa-regular fa-heart"></i></a>
                    <a href="#" class="cart-icon"><i class="fa-solid fa-bag-shopping"></i><span
                            id="cart-count">0</span></a>
                </div>
            </div>
        </div>
    </nav>
    <section class="checkout-header">
        <div class="container text-center">
            <h1>Checkout</h1>
            <p>Complete Your Purchase</p>
        </div>
    </section>
    <section class="checkout-section py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="checkout-box">
                        <h3>Billing Details</h3>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label>First Name</label>
                                <input type="text" class="form-control" id="firstname" placeholder="Enter Name">
                            </div>
                            <div class="col-md-6">
                                <label>Last Name</label>
                                <input type="text" class="form-control" id="lastname" placeholder="Enter Last Name">
                            </div>
                            <div class="col-12">
                                <label>Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter Your Email">
                            </div>
                            <div class="col-12">
                                <label>Mobile Number</label>
                                <input type="tel" class="form-control" id="mobile" placeholder="Enter Phone Number">
                            </div>
                            <div class="col-12">
                                <label>Address</label>
                                <input type="text" class="form-control" id="address" placeholder="Enter Your Address">
                            </div>
                            <div class="col-md-6">
                                <label>City</label>
                                <input type="text" class="form-control" id="city" placeholder="Enter City">
                            </div>
                            <div class="col-md-6">
                                <label>Postal Code</label>
                                <input type="text" class="form-control" id="postalcode" placeholder="Postal Code">
                            </div>
                        </div>
                    </div>
                    <div class="checkout-box mt-4">
                        <h3>Payment Method</h3>
                        <div class="payment-option">
                            <input type="radio" name="payment" id="cod" checked>
                            <label for="cod"><i class="fa-solid fa-money-bill-wave"></i>Cash On Delivery</label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" name="payment" id="card">
                            <label for="card"><i class="fa-solid fa-credit-card"></i>Card Payment</label>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="checkout-summary">
                        <h3>Order Summary</h3>
                        <hr>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>$68.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span>Free</span>
                        </div>
                        <div class="summary-row">
                            <span>Discount</span>
                            <span>$6.80</span>
                        </div>
                        <div class="summary-total">
                            <span>Total</span>
                            <span>$61.20</span>
                        </div>
                        <button class="place-order-btn"><i class="fa-solid fa-lock"></i>Place Order</button>
                     </div>
                </div>
            </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/checkout.js"></script>
</body>

</html>
